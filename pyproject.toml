[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roosterly-support-agent"
version = "0.1.0"
description = "Small, auditable support-ticket agent for the Nordavo take-home"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "python-dotenv>=1,<2"]

[project.scripts]
roosterly = "roosterly.cli:main"

[tool.setuptools.package-data]
roosterly = ["faq.md"]

[tool.setuptools.packages.find]
include = ["roosterly*"]
